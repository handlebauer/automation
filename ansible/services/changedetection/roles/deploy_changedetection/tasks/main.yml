---
- name: Validate changedetection_password is provided
  ansible.builtin.fail:
    msg: "changedetection_password is required — pass it with -e 'changedetection_password=xxx'"
  when: changedetection_password is not defined

- name: Check if salted pass already exists
  ansible.builtin.shell:
    cmd: grep -oP 'SALTED_PASS=\K.*' /home/{{ service_user }}/services/changedetection/docker-compose.yml
  register: existing_salted_pass
  changed_when: false
  failed_when: false

- name: Generate salted password hash
  ansible.builtin.command:
    cmd: >-
      python3 -c "import hashlib,os,base64;
      salt=os.urandom(32);
      key=hashlib.pbkdf2_hmac('sha256','{{ changedetection_password }}'.encode(),salt,100000);
      print(base64.b64encode(salt+key).decode())"
  register: salted_pass_result
  changed_when: false
  when: existing_salted_pass.stdout | length == 0

- name: Set salted pass fact
  ansible.builtin.set_fact:
    changedetection_salted_pass: "{{ existing_salted_pass.stdout if existing_salted_pass.stdout | length > 0 else salted_pass_result.stdout }}"

- name: Create changedetection directory
  ansible.builtin.file:
    path: "/home/{{ service_user }}/services/changedetection"
    state: directory
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/home/{{ service_user }}/services/changedetection/docker-compose.yml"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "0644"
  register: compose_file

- name: Deploy Discord notification template
  ansible.builtin.copy:
    src: discord-notification.json
    dest: "/home/{{ service_user }}/services/changedetection/discord-notification.json"
    owner: "{{ service_user }}"
    group: "{{ service_user }}"
    mode: "0644"

- name: Start changedetection
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "/home/{{ service_user }}/services/changedetection"
  become: true
  become_user: "{{ service_user }}"
  when: compose_file.changed

- name: Ensure changedetection is running
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "/home/{{ service_user }}/services/changedetection"
  become: true
  become_user: "{{ service_user }}"
  changed_when: false
  when: not compose_file.changed

- name: Wait for changedetection to be ready
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ changedetection_port }}/"
    status_code: [200, 302]
  register: cd_health
  retries: 15
  delay: 5
  until: cd_health.status in [200, 302]

- name: Copy Discord template into container volume
  ansible.builtin.command:
    cmd: docker cp /home/{{ service_user }}/services/changedetection/discord-notification.json changedetection:/datastore/discord-notification.json
  changed_when: false
  when: changedetection_notification_url is defined

- name: Configure notifications in datastore
  ansible.builtin.shell:
    cmd: |
      docker exec changedetection python3 -c "
      import json
      with open('/datastore/changedetection.json', 'r') as f:
          data = json.load(f)
      body = open('/datastore/discord-notification.json').read()
      data['settings']['application']['notification_urls'] = ['{{ changedetection_notification_url }}']
      data['settings']['application']['notification_body'] = body
      data['settings']['application']['notification_format'] = 'text'
      with open('/datastore/changedetection.json', 'w') as f:
          json.dump(data, f, indent=2)
      "
  when: changedetection_notification_url is defined

- name: Restart changedetection to pick up config
  ansible.builtin.command:
    cmd: docker compose restart changedetection
    chdir: "/home/{{ service_user }}/services/changedetection"
  become: true
  become_user: "{{ service_user }}"
  when: changedetection_notification_url is defined
