---
- name: Check if fastfetch is installed
  ansible.builtin.command:
    cmd: fastfetch --version
  register: fastfetch_check
  changed_when: false
  failed_when: false

- name: Get system architecture
  ansible.builtin.command:
    cmd: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false
  when: fastfetch_check.rc != 0

- name: Install fastfetch from GitHub
  ansible.builtin.apt:
    deb: "https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-{{ 'amd64' if dpkg_arch.stdout == 'amd64' else 'aarch64' }}.deb"
    state: present
  when: fastfetch_check.rc != 0

- name: Disable all default MOTD scripts
  ansible.builtin.shell:
    cmd: chmod -x /etc/update-motd.d/* 2>/dev/null || true
  changed_when: false

- name: Disable PAM MOTD modules
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    regexp: ".*pam_motd\\.so.*"
    state: absent

- name: Remove static MOTD file
  ansible.builtin.copy:
    dest: /etc/motd
    content: ""
    mode: "0644"
