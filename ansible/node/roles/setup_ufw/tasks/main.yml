---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set default policy to deny incoming
  community.general.ufw:
    direction: incoming
    default: deny

- name: Set default policy to allow outgoing
  community.general.ufw:
    direction: outgoing
    default: allow

- name: Allow configured ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
