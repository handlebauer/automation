---
- name: Create user {{ username }}
  ansible.builtin.user:
    name: "{{ username }}"
    shell: /bin/bash
    create_home: true
    state: present

- name: Grant passwordless sudo to {{ username }}
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ username }}"
    content: "{{ username }} ALL=(ALL) NOPASSWD:ALL\n"
    mode: "0440"
    validate: "visudo -cf %s"
