---
- name: Install Starship prompt
  ansible.builtin.shell:
    cmd: curl -sS https://starship.rs/install.sh | sh -s -- -y
  args:
    creates: /usr/local/bin/starship

- name: Create .config directory for {{ username }}
  ansible.builtin.file:
    path: "/home/{{ username }}/.config"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

- name: Deploy starship config for {{ username }}
  ansible.builtin.copy:
    src: starship.toml
    dest: "/home/{{ username }}/.config/starship.toml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
