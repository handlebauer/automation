---
- name: Validate tailscale_key is provided
  ansible.builtin.fail:
    msg: "tailscale_key is required — pass it with -e 'tailscale_key=tskey-auth-XXXXX'"
  when: tailscale_key is not defined

- name: Install Tailscale
  ansible.builtin.shell:
    cmd: curl -fsSL https://tailscale.com/install.sh | sh
  args:
    creates: /usr/bin/tailscale

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Check if already authenticated
  ansible.builtin.command:
    cmd: tailscale status
  register: ts_status
  changed_when: false
  failed_when: false

- name: Authenticate and configure Tailscale
  ansible.builtin.command:
    cmd: >-
      tailscale up
      --auth-key={{ tailscale_key }}
      --ssh
      --hostname={{ hostname }}
      --accept-routes
  when: ts_status.rc != 0
