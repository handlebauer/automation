all:
  hosts:
    # The VPS that will be the control node (must already be bootstrapped via ansible/vps/).
    # Use Tailscale IP + automation user.
    #
    # Example:
    # control:
    #   ansible_host: 100.x.x.x
    ndt-2:
      ansible_host: 100.79.252.58
  vars:
    ansible_user: automation
    ansible_ssh_private_key_file: ~/.ssh/id_automation
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
