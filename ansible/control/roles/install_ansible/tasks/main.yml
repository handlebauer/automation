---
- name: Install uv
  ansible.builtin.shell:
    cmd: curl -fsSL https://astral.sh/uv/install.sh | sh
  become: true
  become_user: "{{ control_user }}"
  args:
    creates: "/home/{{ control_user }}/.local/bin/uv"

- name: Install Ansible via uv tool
  ansible.builtin.command:
    cmd: /home/{{ control_user }}/.local/bin/uv tool install ansible-core --with ansible
    creates: "/home/{{ control_user }}/.local/bin/ansible-playbook"
  become: true
  become_user: "{{ control_user }}"
