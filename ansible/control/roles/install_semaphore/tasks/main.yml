---
- name: Validate semaphore_admin_password is provided
  ansible.builtin.fail:
    msg: "semaphore_admin_password is required — pass it with -e 'semaphore_admin_password=xxx'"
  when: semaphore_admin_password is not defined

- name: Create Semaphore directory
  ansible.builtin.file:
    path: "/home/{{ control_user }}/semaphore"
    state: directory
    owner: "{{ control_user }}"
    group: "{{ control_user }}"
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "/home/{{ control_user }}/semaphore/docker-compose.yml"
    owner: "{{ control_user }}"
    group: "{{ control_user }}"
    mode: "0600"

- name: Start Semaphore
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "/home/{{ control_user }}/semaphore"
  become: true
  become_user: "{{ control_user }}"
